<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CSIR NET Mock Test Result | Physics by Radheshyam</title><meta name="description" content="View your CSIR NET Physical Sciences mock test score, Part A/B/C performance, accuracy and question-wise solutions."><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://radheshyamprajapat.github.io/Physics-by-Radheshyam/result.html"><link rel="stylesheet" href="assets/style.css"><style>body{background:#f3f5f8}.wrap{max-width:1100px;margin:35px auto;padding:0 16px}.card{background:#fff;border:1px solid #d9e0e8;border-radius:10px;padding:26px}.hero{display:flex;justify-content:space-between;gap:15px;align-items:center}.score{font-size:42px;font-weight:900;color:#123c69}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.box{border:1px solid #d9e0e8;border-radius:8px;padding:16px;text-align:center}.box b{display:block;font-size:24px;color:#123c69}.section{border-top:1px solid #e1e5eb;padding:18px 0}.sol{border-top:1px solid #e5e8ed;padding:15px 0}.correct{color:#198754}.wrong{color:#c62828}.un{color:#6c757d}.ignored{color:#9a6700}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.hero{display:block}.score{font-size:34px}}</style></head><body><div class="wrap"><div class="card"><div class="hero"><div><h1>CSIR NET Physical Sciences</h1><p id="mode"></p></div><div class="score" id="score">—</div></div><div class="grid"><div class="box"><span>Correct</span><b id="correct">0</b></div><div class="box"><span>Wrong</span><b id="wrong">0</b></div><div class="box"><span>Unattempted</span><b id="unattempted">0</b></div><div class="box"><span>Accuracy</span><b id="accuracy">0%</b></div></div><div id="sections"></div><h2>Question-wise Analysis & Solutions</h2><div id="solutions"></div><p><a href="tests.html">← Back to Mock Tests</a></p></div></div><script>(()=>{const raw=sessionStorage.getItem('pbr_result');if(!raw){document.getElementById('solutions').innerHTML='<p>No test result found. Please start a mock test first.</p>';return}const r=JSON.parse(raw),q=r.questions,a=r.answers,cfg=r.cfg;const partNames={A:'Part A — General Aptitude',B:'Part B — Physical Sciences',C:'Part C — Physical Sciences'};let total=0,correct=0,wrong=0,un=0;const stats={A:{correct:0,wrong:0,un:0,score:0,attempted:0},B:{correct:0,wrong:0,un:0,score:0,attempted:0},C:{correct:0,wrong:0,un:0,score:0,attempted:0}};q.forEach((x,i)=>{const p=x.part,sec=cfg.sections[p];if(a[i]===null){un++;stats[p].un++;return}stats[p].attempted++;if(a[i]===x.answer){correct++;stats[p].correct++;stats[p].score+=sec.marks}else{wrong++;stats[p].wrong++;stats[p].score-=sec.negative}});total=Object.values(stats).reduce((s,x)=>s+x.score,0);const attempted=correct+wrong;document.getElementById('score').textContent=`${total.toFixed(3)} / 200`;document.getElementById('correct').textContent=correct;document.getElementById('wrong').textContent=wrong;document.getElementById('unattempted').textContent=un;document.getElementById('accuracy').textContent=(attempted?((correct/attempted)*100).toFixed(1):'0')+'%';document.getElementById('mode').textContent=r.auto?'Time expired — test auto-submitted':'Test submitted successfully';document.getElementById('sections').innerHTML=Object.keys(stats).map(p=>{const s=stats[p];return `<div class="section"><h2>${partNames[p]}</h2><p>Attempted: ${s.attempted} / ${cfg.sections[p].attemptLimit} &nbsp; | &nbsp; Correct: ${s.correct} &nbsp; | &nbsp; Wrong: ${s.wrong} &nbsp; | &nbsp; Score: <b>${s.score.toFixed(3)}</b></p></div>`}).join('');document.getElementById('solutions').innerHTML=q.map((x,i)=>{let cls=a[i]===null?'un':a[i]===x.answer?'correct':'wrong';let label=a[i]===null?'Unattempted':a[i]===x.answer?'Correct':'Wrong';return `<div class="sol"><div><b>Q${i+1} — Part ${x.part}</b> <span class="${cls}">${label}</span></div><p>${x.question}</p><p><b>Your answer:</b> ${a[i]===null?'—':x.options[a[i]]}<br><b>Correct answer:</b> ${x.options[x.answer]}</p><p><b>Explanation:</b> ${x.explanation}</p></div>`}).join('')})();</script></body></html>
