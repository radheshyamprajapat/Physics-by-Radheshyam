<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mock Test Result | Physics by Radheshyam</title><meta name="description" content="View your Physics mock test score, accuracy, attempted questions and detailed solutions."><meta name="robots" content="noindex,follow"><link rel="canonical" href="https://radheshyamprajapat.github.io/Physics-by-Radheshyam/result.html"><link rel="stylesheet" href="assets/style.css"><style>body{background:#f3f5f8}.result-wrap{max-width:1050px;margin:35px auto;padding:0 18px}.result-card{background:#fff;border:1px solid #d8dee6;border-radius:8px;padding:28px}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.score-box{border:1px solid #d7dde5;border-radius:6px;padding:16px;text-align:center}.score-box strong{display:block;font-size:28px;color:#123c69}.solution{border-top:1px solid #e0e5eb;padding:16px 0;line-height:1.6}.correct{color:#16834f}.wrong{color:#c62828}.unattempted{color:#6c757d}@media(max-width:700px){.score-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><header class="navbar"><div class="container nav-inner"><a class="brand" href="index.html">Physics by Radheshyam<small>Learn Physics. Build Concepts. Crack Exams.</small></a><nav class="nav-links"><a href="index.html">Home</a><a href="courses.html">Courses</a><a href="notes.html">Notes</a><a href="pyqs.html">PYQs</a><a class="active" href="tests.html">Mock Tests</a><a href="formula-sheets.html">Formula Sheets</a><a href="youtube.html">YouTube</a><a href="about.html">About</a></nav></div></header><main class="result-wrap" id="result"><p>Loading result...</p></main><script>const r=JSON.parse(sessionStorage.getItem('pbr_result')||'null');const el=document.getElementById('result');if(!r){el.innerHTML='<div class="result-card"><h1>No result found</h1><p>Start a mock test first.</p><a class="btn" href="tests.html">Back to Mock Tests</a></div>';}else{const {cfg,questions,answers,correct,wrong,un,score,accuracy,auto}=r;el.innerHTML=`<div class="result-card"><div class="section-kicker">PHYSICS BY RADHESHYAM</div><h1>${cfg.title}</h1><p>${auto?'The test was submitted automatically because the timer reached zero.':'Test submitted successfully.'}</p><div class="score-grid"><div class="score-box"><strong>${score}</strong>Score</div><div class="score-box"><strong>${correct}</strong>Correct</div><div class="score-box"><strong>${wrong}</strong>Wrong</div><div class="score-box"><strong>${accuracy}%</strong>Accuracy</div></div><p><b>Attempted:</b> ${correct+wrong} &nbsp; <b>Unattempted:</b> ${un}</p><p><a class="btn" href="mock-test.html?test=csir-net-mock-01">Retake Test</a> <a class="btn btn-light" href="tests.html">All Mock Tests</a></p><h2>Detailed Solutions</h2>${questions.map((q,i)=>{let a=answers[i];let state=a===null?'<span class="unattempted">Unattempted</span>':a===q.answer?'<span class="correct">Correct</span>':'<span class="wrong">Wrong</span>';return `<div class="solution"><h3>Q${i+1}. ${state}</h3><div><b>${q.question}</b></div><p>Your answer: ${a===null?'Not attempted':q.options[a]}<br>Correct answer: <b>${q.options[q.answer]}</b></p><p>${q.explanation}</p></div>`}).join('')}</div>`;}</script></body></html>
