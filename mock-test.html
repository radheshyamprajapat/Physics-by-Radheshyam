<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSIR NET Physics Mock Test 01 | Physics by Radheshyam</title>
<meta name="description" content="Attempt CSIR NET Physics Mock Test 01 in a timed CBT-style interface with question palette, mark for review, instant score and detailed solutions.">
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://radheshyamprajapat.github.io/Physics-by-Radheshyam/mock-test.html">
<link rel="stylesheet" href="assets/style.css">
<style>
:root{--cbt-blue:#123c69;--cbt-dark:#0b2545;--cbt-border:#d7dde5;--cbt-bg:#f3f5f8;--answered:#20a464;--notanswered:#dc3545;--review:#7a4bb7;--notvisited:#6c757d}
body.cbt-body{margin:0;background:var(--cbt-bg);color:#1e293b;font-family:Arial,Helvetica,sans-serif}
.cbt-top{height:66px;background:#fff;border-bottom:1px solid #cfd6df;display:flex;align-items:center;justify-content:space-between;padding:0 22px;box-sizing:border-box;position:sticky;top:0;z-index:20}.cbt-brand{font-weight:800;color:var(--cbt-dark);font-size:18px}.cbt-testname{font-weight:700;font-size:15px}.timer{background:#fff4d6;border:1px solid #e5c15a;padding:10px 16px;border-radius:5px;font-weight:800;color:#7b5600;min-width:110px;text-align:center}.cbt-main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:0;max-width:1500px;margin:auto;min-height:calc(100vh - 66px)}.question-panel{background:#fff;border-right:1px solid var(--cbt-border);padding:0 26px 100px}.question-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--cbt-border);padding:18px 0}.question-number{font-weight:800}.subject-tag{font-size:12px;border:1px solid #c9d3df;border-radius:4px;padding:6px 9px;background:#f8fafc}.question-text{font-size:19px;line-height:1.6;margin:26px 0 22px;font-weight:600}.options{display:flex;flex-direction:column;gap:13px}.option{display:flex;gap:12px;align-items:flex-start;border:1px solid #cbd3dc;border-radius:4px;padding:14px 15px;cursor:pointer;background:#fff}.option:hover{background:#f8fbff;border-color:#8baed0}.option input{margin-top:4px}.option.selected{background:#eef6ff;border-color:#2b74b8}.controls{position:fixed;bottom:0;left:0;right:320px;background:#fff;border-top:1px solid var(--cbt-border);display:flex;justify-content:space-between;gap:10px;padding:12px 20px;z-index:10}.btn-cbt{border:1px solid #aab5c1;background:#fff;color:#26384a;padding:10px 15px;border-radius:4px;font-weight:700;cursor:pointer}.btn-cbt.primary{background:#0b5ea8;border-color:#0b5ea8;color:#fff}.btn-cbt.review{background:#fff;border-color:#7a4bb7;color:#6b3ca7}.btn-cbt:hover{filter:brightness(.97)}.palette{background:#fff;padding:18px;border-left:1px solid var(--cbt-border)}.palette-title{font-size:17px;font-weight:800;margin-bottom:15px}.palette-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.qnum{height:38px;border:1px solid #b9c1cb;background:#fff;border-radius:4px;cursor:pointer;font-weight:700}.qnum.current{outline:3px solid #8bb9e0;outline-offset:1px}.qnum.answered{background:var(--answered);border-color:var(--answered);color:#fff}.qnum.notanswered{background:var(--notanswered);border-color:var(--notanswered);color:#fff}.qnum.review{background:var(--review);border-color:var(--review);color:#fff}.qnum.review-answered{background:linear-gradient(135deg,var(--answered) 0 50%,var(--review) 50%);border-color:var(--review);color:#fff}.legend{margin:20px 0;border-top:1px solid var(--cbt-border);padding-top:16px}.legend div{display:flex;align-items:center;gap:9px;margin:10px 0;font-size:13px}.dot{width:18px;height:18px;border-radius:3px;display:inline-block;border:1px solid #aaa}.d-answered{background:var(--answered);border-color:var(--answered)}.d-notanswered{background:var(--notanswered);border-color:var(--notanswered)}.d-review{background:var(--review);border-color:var(--review)}.d-notvisited{background:#fff}.submit-box{margin-top:22px;border-top:1px solid var(--cbt-border);padding-top:18px}.submit-btn{width:100%;padding:13px;background:#198754;border:0;color:#fff;border-radius:4px;font-weight:800;cursor:pointer}.mobile-palette-btn{display:none}
.result-wrap{max-width:1050px;margin:40px auto;padding:0 18px}.result-card{background:#fff;border:1px solid #d8dee6;border-radius:8px;padding:30px}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.score-box{border:1px solid #d7dde5;border-radius:6px;padding:16px;text-align:center}.score-box strong{display:block;font-size:28px;color:#123c69}.solution{border-top:1px solid #e0e5eb;padding:18px 0}.solution h3{margin:0 0 8px}.correct{color:#16834f;font-weight:700}.wrong{color:#c62828;font-weight:700}.unattempted{color:#6c757d;font-weight:700}
@media(max-width:900px){.cbt-top{padding:0 12px}.cbt-testname{display:none}.cbt-main{grid-template-columns:1fr}.palette{position:fixed;right:0;top:66px;bottom:0;width:300px;z-index:30;transform:translateX(100%);transition:.2s;box-shadow:-5px 0 18px rgba(0,0,0,.12);overflow:auto}.palette.open{transform:translateX(0)}.mobile-palette-btn{display:block}.controls{right:0;padding:10px}.controls .btn-cbt{padding:9px 10px;font-size:12px}.question-panel{padding:0 15px 90px}.score-grid{grid-template-columns:repeat(2,1fr)}}
</style>
<script src="assets/tests/test-config.js"></script>
</head>
<body class="cbt-body">
<header class="cbt-top"><div class="cbt-brand">Physics by Radheshyam</div><div class="cbt-testname" id="testName">Physics Mock Test</div><button class="mobile-palette-btn btn-cbt" id="paletteToggle">Question Palette</button><div class="timer" id="timer">30:00</div></header>
<main class="cbt-main" id="testScreen"><section class="question-panel"><div class="question-head"><span class="question-number" id="questionNo">Question No. 1</span><span class="subject-tag" id="subjectTag">Physics</span></div><div class="question-text" id="questionText"></div><div class="options" id="options"></div></section><aside class="palette" id="palette"><div class="palette-title">Question Palette</div><div class="palette-grid" id="paletteGrid"></div><div class="legend"><div><span class="dot d-answered"></span> Answered</div><div><span class="dot d-notanswered"></span> Not Answered</div><div><span class="dot d-review"></span> Marked for Review</div><div><span class="dot d-notvisited"></span> Not Visited</div></div><div class="submit-box"><button class="submit-btn" id="submitTest">Submit Test</button></div></aside></main>
<div class="controls"><div><button class="btn-cbt" id="clearBtn">Clear Response</button><button class="btn-cbt review" id="reviewBtn">Mark for Review & Next</button></div><div><button class="btn-cbt" id="prevBtn">Previous</button><button class="btn-cbt primary" id="nextBtn">Save & Next</button></div></div>
<div id="resultScreen" hidden></div>
<script>
(function(){
 const params=new URLSearchParams(location.search); const testId=params.get('test')||'csir-net-mock-01'; const cfg=window.TESTS[testId]||window.TESTS['csir-net-mock-01'];
 let questions=[]; let current=0; let answers=[]; let review=[]; let timeLeft=cfg.duration*60; let timerHandle;
 const $=id=>document.getElementById(id);
 $('testName').textContent=cfg.title;
 const script=document.createElement('script'); script.src=cfg.questionsFile; script.onload=init; script.onerror=()=>alert('Question bank could not be loaded. Check the file path.'); document.head.appendChild(script);
 function init(){questions=window.PHYSICS_QUESTIONS||[]; answers=Array(questions.length).fill(null); review=Array(questions.length).fill(false); renderPalette(); renderQuestion(); startTimer();}
 function renderQuestion(){const q=questions[current]; if(!q)return; $('questionNo').textContent='Question No. '+(current+1); $('subjectTag').textContent=q.subject+' • '+q.topic; $('questionText').textContent=q.question; $('options').innerHTML=q.options.map((o,i)=>`<label class="option ${answers[current]===i?'selected':''}"><input type="radio" name="answer" value="${i}" ${answers[current]===i?'checked':''}> <span><b>${String.fromCharCode(65+i)}.</b> ${o}</span></label>`).join(''); document.querySelectorAll('input[name=answer]').forEach(el=>el.addEventListener('change',()=>{answers[current]=Number(el.value);renderPalette();renderQuestion();})); renderPalette();}
 function status(i){if(review[i]&&answers[i]!==null)return'review-answered';if(review[i])return'review';if(answers[i]!==null)return'answered';return i===current?'current':'notanswered'}
 function renderPalette(){$('paletteGrid').innerHTML=questions.map((q,i)=>`<button class="qnum ${status(i)} ${i===current?'current':''}" data-i="${i}">${i+1}</button>`).join('');document.querySelectorAll('.qnum').forEach(b=>b.onclick=()=>{current=Number(b.dataset.i);renderQuestion();closePalette();});}
 function next(){if(current<questions.length-1){current++;renderQuestion();}else{confirmSubmit();}}
 function prev(){if(current>0){current--;renderQuestion();}}
 $('nextBtn').onclick=next; $('prevBtn').onclick=prev; $('clearBtn').onclick=()=>{answers[current]=null;renderQuestion();}; $('reviewBtn').onclick=()=>{review[current]=true;next();}; $('submitTest').onclick=confirmSubmit;
 $('paletteToggle').onclick=()=>{$('palette').classList.toggle('open')}; function closePalette(){$('palette').classList.remove('open')}
 function startTimer(){updateTimer();timerHandle=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timerHandle);submit(true)}},1000)}
 function updateTimer(){const m=Math.floor(timeLeft/60),s=timeLeft%60;$('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(timeLeft<=300)$('timer').style.background='#ffe2e2';}
 function confirmSubmit(){const unattempted=answers.filter(a=>a===null).length;if(confirm('Submit this test now? '+unattempted+' question(s) are unattempted.'))submit(false)}
 function submit(auto){clearInterval(timerHandle);const correct=answers.reduce((n,a,i)=>n+(a!==null&&a===questions[i].answer?1:0),0);const wrong=answers.reduce((n,a,i)=>n+(a!==null&&a!==questions[i].answer?1:0),0);const un=answers.filter(a=>a===null).length;const score=correct*4;const attempted=correct+wrong;const accuracy=attempted?Math.round(correct/attempted*100):0;sessionStorage.setItem('pbr_result',JSON.stringify({cfg,questions,answers,correct,wrong,un,score,accuracy,auto}));location.href='result.html';}
})();
</script>
</body></html>
